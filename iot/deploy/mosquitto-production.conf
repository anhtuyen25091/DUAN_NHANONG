# Mosquitto khi chạy thật: bắt buộc mật khẩu, mã hóa TLS (cổng 8883). Thiết bị dùng cùng tài khoản MQTT,
# còn từng thiết bị vẫn được kiểm bằng khóa riêng trong bản tin (trường "key").
#
#   mosquitto_passwd -c /etc/mosquitto/passwd nhanong-device     # tài khoản cho thiết bị
#   mosquitto_passwd    /etc/mosquitto/passwd nhanong-server     # tài khoản cho iot:mqtt-listen (IOT_MQTT_USERNAME / IOT_MQTT_PASSWORD)
#
# Chứng chỉ: dùng Let's Encrypt của tên miền máy chủ (certbot), Mosquitto cần quyền đọc file.

per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

persistence true
persistence_location /var/lib/mosquitto/
# Giữ bản tin cho iot:mqtt-listen trong lúc khởi động lại
max_queued_messages 100000

# Chỉ máy chủ (cùng máy) dùng cổng không mã hóa
listener 1883 127.0.0.1

listener 8883
certfile /etc/letsencrypt/live/iot.example.vn/fullchain.pem
keyfile /etc/letsencrypt/live/iot.example.vn/privkey.pem
