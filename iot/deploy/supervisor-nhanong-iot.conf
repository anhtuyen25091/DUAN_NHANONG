; Mẫu supervisor cho máy chủ chạy thật: chép vào /etc/supervisor/conf.d/ rồi `supervisorctl reread && supervisorctl update`.
; Sửa đường dẫn /var/www/nhanong/iot và user www-data cho đúng máy chủ.
; Lịch (gộp số đo, dọn dữ liệu cũ) chạy bằng cron:  * * * * * cd /var/www/nhanong/iot && php artisan schedule:run >> /dev/null 2>&1

[program:nhanong-iot-queue]
; Xét ngưỡng + gửi thông báo đẩy khi số đo vượt ngưỡng
command=php /var/www/nhanong/iot/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/www/nhanong/iot/storage/logs/queue.log

[program:nhanong-iot-mqtt]
; Nhận số đo qua MQTT. Chỉ chạy 1 tiến trình (mã client cố định IOT_MQTT_CLIENT_ID, phiên bền:
; lúc tiến trình khởi động lại, Mosquitto giữ bản tin QoS 1 và giao bù)
command=php /var/www/nhanong/iot/artisan iot:mqtt-listen
user=www-data
numprocs=1
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/www/nhanong/iot/storage/logs/mqtt.log
