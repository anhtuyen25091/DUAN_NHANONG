; Firmware mẫu Nhà Nông IoT cho ESP32: đọc cảm biến RS485/Modbus + siêu âm, gửi về API,
; lưu hàng đợi khi mất mạng, phát WiFi riêng để điện thoại tải dữ liệu ở ruộng không có sóng.
;   pio run -t upload && pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_deps =
    4-20ma/ModbusMaster@^2.0.1
    adafruit/RTClib@^2.1.4
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8

; Bản cập nhật được qua mạng (OTA): 2 vùng chương trình 1,6 MB, LittleFS còn ~640 KB (hàng đợi ≈ 2–3 tuần số đo 15 phút/lần).
; Nạp lần đầu bằng cáp: pio run -e esp32dev-ota -t upload. Các bản sau: pio run -e esp32dev-ota, rồi tải
; .pio/build/esp32dev-ota/firmware.bin lên /admin > Cập nhật firmware (nhớ tăng FIRMWARE_VERSION).
[env:esp32dev-ota]
extends = env:esp32dev
board_build.partitions = partitions-ota.csv
build_flags = -DOTA_ENABLED=1
